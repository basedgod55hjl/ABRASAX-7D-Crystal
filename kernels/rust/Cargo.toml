[package]
name = "abrasax_7d_core"
version = "0.1.0"
edition = "2021"
description = "ABRASAX 7D Core — Rust compute engine with rune-encoded tensor ops"
authors = ["BASEDGOD"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
bytemuck = { version = "1.18", features = ["derive"] }
winapi = { version = "0.3", features = ["winbase", "winnt", "namedpipeapi", "fileapi", "minwinbase", "handleapi", "synchapi"] }

[[bin]]
name = "abrasax_7d_core"
path = "src/main.rs"
