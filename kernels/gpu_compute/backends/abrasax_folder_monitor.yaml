# --- Full GPU pin: single device, max layers, same knobs as performance_config llm_controls.inference ---
gpu_full_pin:
  enabled: true
  cuda_visible_devices: '0'
  performance_config: 'C:\Users\BASEDGOD\ABRASAX\gpu_compute\backends\cbm_system\performance_config.json'
  priority_compute_apps:
    - 'LM Studio.exe'
    - 'lms.exe'
    - 'Cursor.exe'
    - 'Antigravity.exe'
    - 'python.exe'
  inference:
    num_gpu_layers: 999
    num_ctx: 8192
    num_thread: 16
    nvidia_vram_cap_gb: 0
  env:
    CUDA_VISIBLE_DEVICES: '0'
    CUDA_LAUNCH_BLOCKING: '0'
    CUDA_CACHE_MAXSIZE: '2147483647'

# --- LLM: stats / discovery (GET all); chat uses POST /v1/chat/completions ---
# Source of truth: edit gpu_compute/backends/cbm_system/performance_config.json (llm_controls); keep URLs/models in sync below.
llm_controls_ref: 'C:\Users\BASEDGOD\ABRASAX\gpu_compute\backends\cbm_system\performance_config.json'
llm:
  base_url: 'http://169.254.83.107:1234/v1'
  models:
    - 'google/gemma-4-e4b-uncensored-hauhaucs-aggressive'
    - 'text-embedding-nomic-embed-text-v1.5'
  stat_all:
    - name: models_list
      method: GET
      url: 'http://169.254.83.107:1234/v1/models'
      note: Lists all served model ids (e.g. gemma + embedding).
  smoke_chat:
    method: POST
    url: 'http://169.254.83.107:1234/v1/chat/completions'
    body_hint:
      model: google/gemma-4-e4b-uncensored-hauhaucs-aggressive
      messages:
        - role: user
          content: ping

