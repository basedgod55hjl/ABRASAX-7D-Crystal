# ABRASAX — gpu_compute/backends folder monitor + GPU/LLM control surface (single file)
# Paths: Windows; consumers should resolve env overrides (LOCAL_LLM_URL, CUDA_VISIBLE_DEVICES, etc.).

name: 12_GPU_COMPUTE_monitor
version: '2.8'
watch: true
auto_fix: true
loki_enabled: true
datadog_enabled: true
agent_pool: 50
model: google/gemma-4-e4b-uncensored-hauhaucs-aggressive

# --- Full tree: watch backends + k8s + LLM_ENGINE mythos + notebook corpus (read-only assets) ---
# notebook_output/extracted_scripts: use existing files only; catalog = MASTER_NOTEBOOK_INDEX.md (do not add generators here).
watch_roots:
  - 'C:\Users\BASEDGOD\ABRASAX\gpu_compute\backends'
  - 'C:\Users\BASEDGOD\ABRASAX\k8s'
  - 'C:\Users\BASEDGOD\ABRASAX\LLM_ENGINE\mythos'
  - 'C:\Users\BASEDGOD\ABRASAX\LLM_ENGINE\notebook_output'
  - 'C:\Users\BASEDGOD\ABRASAX\src\services'
include_globs:
  - '**/*'
exclude_globs: []

# --- All Python bytecode: track every .pyc under __pycache__ (hash/size in monitor logs) ---
bytecode:
  track_all_pyc: true
  globs:
    - '**/__pycache__/**/*.pyc'
    - '**/*.pyc'
  on_stale_with_source_change: rescan
  purge_on_auto_fix: false

