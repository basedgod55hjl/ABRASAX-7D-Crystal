name: ABRASAX CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Style is advisory. It reports, it does not gate: a red job that nothing
      # depends on trains people to ignore red jobs.
      - name: ruff (advisory)
        run: |
          pip install ruff
          ruff check . || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The gate. It compiles EVERY .py in the tree, not just the repo root, and
      # it exits non-zero on the first failure. The previous version only looked
      # at ./*.py and only echoed FAIL, so three unimportable files in src/
      # passed CI unnoticed.
      - name: byte-compile every .py (gate)
        run: |
          set -u
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if python -m py_compile "$f" 2>/tmp/err; then
              echo "  OK: $f"
            else
              echo "::error file=$f::does not compile"
              sed -n '1,6p' /tmp/err | sed 's/^/     /'
              fail=1
            fi
          done < <(find . -name '*.py' -not -path './.git/*' -print0)
          echo "compiled $count file(s); failures=$fail"
          exit $fail
